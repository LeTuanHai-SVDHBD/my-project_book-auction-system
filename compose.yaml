# Mục đích: Chạy SQL Server và Redis cho môi trường phát triển.
name: my-project_book-auction-system
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Run npm run setup first}
    ports:
      - '127.0.0.1:14330:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '127.0.0.1:63790:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  # Giữ fallback hiện hành khi .env chưa chỉ định tên volume; không tự đổi liên kết dữ liệu.
  # Máy cài mới nhận tên chuẩn từ .env.example qua npm run setup.
  # Nếu dữ liệu nằm trong volume book-auction-moc2_*, đặt đúng tên đã inspect vào .env.
  sqlserver_data:
    name: ${SQLSERVER_VOLUME_NAME:-book-auction_sqlserver_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-book-auction_redis_data}
